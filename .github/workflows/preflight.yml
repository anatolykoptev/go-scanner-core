name: preflight
# PR/push gate on GitHub-hosted Actions (this is a public reference repo, where
# hosted runners are free and the expected standard). Runs `make preflight`
# (gofmt + vet + build + test) plus golangci-lint via its own action.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # #53: gostall — static analysis for lock-order inversions, missing
      # unlocks, WaitGroup misuse, channel deadlocks, livelocks, starvation.
      - name: Ensure gostall v1.0.0 (pinned)
        run: |
          GOBIN="$(go env GOPATH)/bin"
          if ! go version -m "$GOBIN/gostall" 2>/dev/null | grep -q "erfanmomeniii/gostall.*v1.0.0"; then
            go install github.com/erfanmomeniii/gostall/cmd/gostall@v1.0.0
          fi
      - run: make preflight
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
