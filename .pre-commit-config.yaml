repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        language: system
        entry: gofmt
        args: [-l, -w]
        types: [go]
      - id: go-vet
        name: go vet
        language: system
        entry: go
        args: [vet, ./...]
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: golangci-lint
        args: [run, ./...]
        types: [go]
        pass_filenames: false
