version: "2"
formatters:
  enable:
    - goimports
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - revive
    - gocognit
    - cyclop
    - funlen
    - mnd
    - dupl
linters-settings:
  funlen:
    lines: 100
    statements: 60
  gocognit:
    min-complexity: 20
  cyclop:
    max-complexity: 15
  dupl:
    threshold: 150
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
